[project]
name = "edgeforge"
version = "0.1.0"
description = "Sports betting intelligence platform: data ingestion, probability models, market comparison."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.43",
    "structlog>=25.4",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeforge"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "DTZ", "T20", "N",
]
# RUF012: SQLAlchemy declarative class attributes (__table_args__ etc.) are mutable by design.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["edgeforge", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["edgeforge"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs a PostgreSQL database (EDGEFORGE_TEST_DATABASE_URL)",
    "network: calls external services; never run in CI",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["edgeforge"]
branch = true
